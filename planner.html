<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planner | Pamilerin Oladosu</title>
  <meta name="description" content="Pamilerin Oladosu - Portfolio">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <a href="index.html" class="logo">Pamilerin<span>.</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">&#9776;</button>
      <ul class="nav-links" id="navLinks"><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="projects.html">Projects</a></li><li><a href="planner.html" class="active">Planner</a></li><li><a href="contact.html">Contact</a></li></ul>
    </nav>
  </header>
  <main>
    <section class="page-head"><h1>Academic Planner</h1><p>Keep track of assignments, tests and study goals.</p></section>
    <section class="planner">
      <form id="taskForm" class="task-form">
        <input type="text" id="taskInput" placeholder="e.g. Submit COS 106 project" aria-label="Task">
        <input type="date" id="taskDate" aria-label="Due date">
        <button type="submit" class="btn">Add Task</button>
      </form>
      <p class="task-error" id="taskError"></p>
      <div class="task-stats"><span id="taskCount">0 tasks</span><div class="filters"><button data-filter="all" class="active">All</button><button data-filter="active">Active</button><button data-filter="done">Completed</button></div></div>
      <ul id="taskList" class="task-list"></ul>
      <p class="empty" id="emptyMsg">No tasks yet. Add one above!</p>
    </section>
  </main>
  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Pamilerin Oladosu &middot; COS 106 Term Project &middot; Miva Open University</p>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
